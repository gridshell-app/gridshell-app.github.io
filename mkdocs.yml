site_name: GridShell
site_description: A real terminal, live-bound to a Google Sheets spreadsheet.
site_url: https://gridshell.app/
docs_dir: docs-site
copyright: "&copy; 2026 The GridShell developers"

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  palette:
    primary: white
    accent: green
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Introduction: index.md
  - App:
      - Quick Start: app/quick-start.md
      - Settings & Limitations: app/settings-and-limitations.md
  - Library:
      - Installation: library/installation.md
      - Server: library/server.md
      - MCP: library/mcp.md
      - Python Client: library/python-client.md
  - Troubleshooting / FAQ: troubleshooting.md
  - Roadmap: roadmap.md
  - Legal:
      - License: legal/license.md
      - Privacy Policy: legal/privacy-policy.md
      - Terms of Service: legal/terms-of-service.md
  - Support: support.md
